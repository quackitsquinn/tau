[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kernel"
test = false
bench = false

[dependencies]
kproc = { path = "../kproc" }
kserial = { path = "../kserial", default-features = false }
cake = { path = "../cake" }
kelp = { path = "../kelp" }
tmm = { path = "../tmm", features = ["x86_64"] }
kalloc = { path = "../tmm/kalloc" }

lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
uart_16550 = "0.4.0"
thiserror = { version = "2.0.3", default-features = false }
rustc-demangle = { version = "0.1.24", default-features = false }
paste = "1.0.15"
bitflags = "2.5.0"
arrayvec = { version = "0.7.6", default-features = false }
pic8259 = "0.11.0"
acpi = "6.0.1"
x86_64 = "0.15.5"
raw-cpuid = "11.6.0"
modular-bitfield = "0.12.0"
bitfield = "0.19.3"

[lints]
workspace = true


[profile.release]
panic = "abort"
debug = true

[profile.dev]
panic = "abort"
# Include all debug info
debug = true
opt-level = 0

[profile.test]
panic = "abort"
debug = true
opt-level = 0
