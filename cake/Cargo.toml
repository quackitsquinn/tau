[package]
name = "cake"
version = "0.1.0"
edition = "2024"

[dependencies]
limine = "0.5.0"
log = "0.4.28"
spin = "0.10.0"
raw-cpuid = "11.6.0"
lock_api = { version = "0.4.14", default-features = false }
arrayvec = { version = "0.7.8", default-features = false }
kelp = { path = "../kelp", default-features = false }
rustc-demangle = { version = "0.1.24", default-features = false }
rand_chacha = { version = "0.10.0", default-features = false }
rand_core = "0.10.1"
rs_sha512_256 = "0.1.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
kproc = { path = "../kproc", default-features = false }
x86_64 = { version = "0.15.5" }

# This is so that `rust-analyzer` doesn't crash and burn
[target.'cfg(unix)'.dev-dependencies]
ctor = "0.4.1"
env_logger = "0.11.7"

[features]
std = []

[lints]
workspace = true
